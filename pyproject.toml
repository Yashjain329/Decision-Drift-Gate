[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-drift-gate"
dynamic = ["version"]
description = "Decision Drift Gate: fail-closed policy gate for AI-proposed checks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["google-genai==2.28.0"]
bedrock = ["boto3>=1.35"]

[project.scripts]
ddg = "ddg:console_main"

[tool.setuptools]
# web/ and evidence/ are installed beside ddg/ because ddg/web.py and ddg/cli.py
# resolve them as <parent of ddg>/web and <parent of ddg>/evidence.
packages = ["ddg", "ddg.adapters", "ddg.providers", "web", "evidence"]

[tool.setuptools.dynamic]
version = { attr = "ddg.__version__" }

[tool.setuptools.package-data]
web = ["*.html", "*.js", "*.css"]
evidence = ["gemini-proposal.json"]
