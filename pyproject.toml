[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-drift-gate"
dynamic = ["version"]
description = "Decision Drift Gate: fail-closed policy gate for AI-proposed checks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["google-genai==2.28.0"]
bedrock = ["boto3>=1.35"]

[project.scripts]
ddg = "ddg:console_main"

[tool.setuptools]
# The built viewer (web/out) and the recorded capture install inside the ddg package as ddg/_viewer and
# ddg/_evidence, so nothing generic lands at the top of site-packages. ddg.viewer_dir() and
# ddg.recorded_capture() prefer those copies and fall back to the source checkout.
packages = ["ddg", "ddg.adapters", "ddg.providers", "ddg._viewer", "ddg._evidence"]

[tool.setuptools.package-dir]
"ddg._viewer" = "web/out"
"ddg._evidence" = "evidence"

[tool.setuptools.dynamic]
version = { attr = "ddg.__version__" }

[tool.setuptools.package-data]
"ddg._viewer" = ["**/*"]  # Next.js static export; build with `npm run build` in web/
"ddg._evidence" = ["gemini-proposal.json"]
